# One Python service, one Postgres, one queue (the queue lives in Postgres).
# Every credential comes from .env (create it with scripts/gen-env.sh); none is written here.
services:
  db:
    image: pgvector/pgvector:pg16
    env_file: [.env]
    environment:
      POSTGRES_DB: cairn
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]   # CAIRN_DATABASE_URL, CAIRN_ADMIN_DATABASE_URL, CAIRN_SECRET_KEY, CAIRN_MASTER_KEY
    environment:
      CAIRN_PUBLIC_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  console:
    build: { context: ./console, args: { CAIRN_API_URL: "http://api:8000" } }
    environment:
      CAIRN_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
